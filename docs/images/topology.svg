<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="title desc"><title id="title">GoVPN connection topology</title><desc id="desc">Administrator browser connects to optional UI, then REST API. The backend controls an IPv4 WireGuard hub. Clients and branch gateways tunnel to the hub; permitted LAN destinations only. Internet uses the existing gateway by default.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".6"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#94a3b8"/></marker></defs><rect width="1120" height="790" rx="18" fill="#020617"/><rect width="1120" height="790" fill="url(#grid)"/><text x="38" y="44" text-anchor="start" fill="#f8fafc" font-family="DejaVu Sans, sans-serif" font-size="27">GoVPN · Connection topology</text><text x="38" y="73" text-anchor="start" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="15">Single admin · IPv4 WireGuard · Split tunnel by default</text><rect x="25" y="100" width="1070" height="227" rx="12" fill="none" stroke="#334155" stroke-dasharray="8 4"/><text x="46" y="124" text-anchor="start" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="12">MANAGEMENT PLANE</text><path d="M245 195H332" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" /><path d="M570 195H660" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" /><path d="M900 195H953" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)" /><path d="M780 249V404" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="45" y="146" width="200" height="100" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/><text x="145.0" y="174" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="18">Administrator</text><text x="145.0" y="199" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Browser / API client</text><text x="145.0" y="220" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Single admin account</text><rect x="332" y="146" width="238" height="100" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/><text x="451.0" y="174" text-anchor="middle" fill="#22d3ee" font-family="DejaVu Sans, sans-serif" font-size="18">GoVPN UI (optional)</text><text x="451.0" y="199" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Go + templ + HTMX</text><text x="451.0" y="220" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">HTTP :8090 · Docker</text><rect x="660" y="146" width="240" height="100" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/><text x="780.0" y="174" text-anchor="middle" fill="#34d399" font-family="DejaVu Sans, sans-serif" font-size="18">GoVPN REST API</text><text x="780.0" y="199" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Go backend · JWT auth</text><text x="780.0" y="220" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">127.0.0.1:8080 by default</text><rect x="953" y="146" width="120" height="100" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5"/><text x="1013.0" y="174" text-anchor="middle" fill="#a78bfa" font-family="DejaVu Sans, sans-serif" font-size="18">State</text><text x="1013.0" y="199" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">JSON files</text><text x="1013.0" y="220" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Local disk</text><text x="286" y="181" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="12">HTTP(S)</text><text x="614" y="181" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="12">REST</text><text x="560" y="289" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="13">HTTPS via optional reverse proxy · keep API private · remote UI uses a protected API link</text><text x="810" y="356" text-anchor="middle" fill="#34d399" font-family="DejaVu Sans, sans-serif" font-size="13">Control / reconcile</text><rect x="25" y="375" width="1070" height="319" rx="12" fill="none" stroke="#334155" stroke-dasharray="8 4"/><text x="46" y="399" text-anchor="start" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="12">DATA PLANE</text><path d="M290 470H417" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" /><path d="M290 610H358V500H417" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" /><path d="M737 480H838" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" /><path d="M838 610H737V523" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow)" /><rect x="45" y="425" width="245" height="95" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/><text x="167.5" y="453" text-anchor="middle" fill="#22d3ee" font-family="DejaVu Sans, sans-serif" font-size="18">VPN clients (C2S)</text><text x="167.5" y="478" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Laptop / phone / workstation</text><text x="167.5" y="499" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">One WireGuard interface per group</text><rect x="45" y="565" width="245" height="95" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/><text x="167.5" y="593" text-anchor="middle" fill="#22d3ee" font-family="DejaVu Sans, sans-serif" font-size="18">Branch gateway A</text><text x="167.5" y="618" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">WireGuard peer</text><text x="167.5" y="639" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">LAN A behind gateway</text><rect x="417" y="420" width="320" height="146" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/><text x="577.0" y="448" text-anchor="middle" fill="#34d399" font-family="DejaVu Sans, sans-serif" font-size="18">GoVPN WireGuard hub</text><text x="577.0" y="473" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Linux kernel WireGuard · UDP</text><text x="577.0" y="494" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Per-site / per-group isolation</text><text x="577.0" y="515" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Allowlisted destinations + firewall</text><text x="577.0" y="536" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Host gateway / DNS unchanged</text><rect x="838" y="425" width="235" height="95" rx="10" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/><text x="955.5" y="453" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="18">Hub local LAN</text><text x="955.5" y="478" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Optional access</text><text x="955.5" y="499" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Only when explicitly enabled</text><rect x="838" y="565" width="235" height="95" rx="10" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5"/><text x="955.5" y="593" text-anchor="middle" fill="#22d3ee" font-family="DejaVu Sans, sans-serif" font-size="18">Branch gateway B</text><text x="955.5" y="618" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">WireGuard peer + LAN B</text><text x="955.5" y="639" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="13">Inter-site access is explicit</text><text x="352" y="451" text-anchor="middle" fill="#22d3ee" font-family="DejaVu Sans, sans-serif" font-size="12">WG / UDP</text><text x="787" y="460" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="12">Allowed</text><text x="560" y="720" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="15">Split tunnel: only allowed VPN / LAN destinations traverse WireGuard.</text><text x="560" y="747" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="14">Other internet traffic keeps the existing client gateway. Full tunnel is opt-in.</text></svg>